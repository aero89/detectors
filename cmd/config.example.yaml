server:
  addr: ":8000"

detector:
  # Алгоритм детекции: "dnn" или "backsub"
  #
  # dnn     — нейросеть (YOLO). Работает на одном кадре, не зависит от угла
  #           камеры. Рекомендуется для камеры в углу помещения.
  #
  # backsub — вычитание фона (MOG2). Не требует модели, обнаруживает только
  #           движущихся людей. Подходит для видеопотока.
  method: "dnn"

  # Ширина рабочего кадра. Bbox-ы возвращаются в координатах оригинала.
  max_width: 960

  dnn:
    # Файлы модели (должны быть в папке models/ рядом с бинарником).
    #
    # Скачать YOLOv4-tiny (~23 MB):
    #   wget https://github.com/AlexeyAB/darknet/releases/download/darknet_yolo_v4_pre/yolov4-tiny.weights -P models/
    #   wget https://raw.githubusercontent.com/AlexeyAB/darknet/master/cfg/yolov4-tiny.cfg -P models/
    #   wget https://raw.githubusercontent.com/pjreddie/darknet/master/data/coco.names -P models/
    model:   "/app/models/yolov4-tiny.weights"
    config:  "/app/models/yolov4-tiny.cfg"
    classes: "/app/models/coco.names"

    # Размер входа сети. YOLOv4-tiny: 416. Больше → точнее, медленнее.
    input_width:  416
    input_height: 416

    # Минимальная уверенность детекции (0–1).
    # objectness × class_score должен превышать этот порог.
    # YOLO обучен на фронтальных снимках — с камеры под углом сверху
    # confidence ниже, чем на обычных фото. Рекомендуется 0.1–0.2.
    conf_threshold: 0.15
    nms_threshold:  0.4

    # ID класса «человек» в модели. В COCO (YOLOv4): 0.
    person_class_id: 0

    # backend: 0=auto  3=opencv(cpu)  5=cuda
    # target:  0=cpu   6=cuda
    backend: 0
    target:  0

  # backsub используется если method: "backsub"
  back_sub:
    history: 500
    var_threshold: 25
    detect_shadows: false
    morph_erode_size: 3
    morph_dilate_size: 20

  contour:
    min_area: 500
    max_area: 80000
    min_width: 30
    min_height: 30

calibration:
  points:
    - image: {x: 375,  y: 905}
      room:  {x: 1.25, y: 3.55}
    - image: {x: 970,  y: 1000}
      room:  {x: 3.07, y: 2.3}
    - image: {x: 905,  y: 515}
      room:  {x: 4.77, y: 5.27}
    - image: {x: 1533, y: 555}
      room:  {x: 8.37, y: 3.22}
    - image: {x: 1726, y: 426}
      room:  {x: 13.15, y: 3.55}
    - image: {x: 1370, y: 405}
      room:  {x: 8.97, y: 5.32}
