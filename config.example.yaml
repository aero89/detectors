server:
  addr: ":8080"

detector:
  # Ширина рабочего кадра. Bbox-ы возвращаются в координатах оригинала.
  # 0 = без ресайза. Для 1920×1080 значение 960 даёт хороший баланс.
  max_width: 960

  back_sub:
    # Количество кадров для построения модели фона.
    # Первые ~history кадров детекция нестабильна — это нормально.
    history: 500

    # Порог чувствительности. Меньше → реагирует на малейшее движение (больше шума).
    # Больше → реагирует только на явное движение (может пропускать медленных людей).
    var_threshold: 25

    # Тени: false — быстрее, тени попадают в маску как передний план.
    # true — тени окрашиваются отдельно и исключаются, но медленнее.
    detect_shadows: false

    # Эрозия убирает мелкий шум (одиночные пиксели). 0 = выключено.
    morph_erode_size: 3

    # Дилатация заполняет дыры внутри силуэта человека и объединяет фрагменты.
    # Увеличьте если человек распадается на несколько контуров.
    morph_dilate_size: 20

  contour:
    # Площадь контура в пикселях рабочего кадра (после max_width ресайза).
    # Слишком маленький контур — шум или тень; слишком большой — группа людей.
    min_area: 500
    max_area: 80000

    # Минимальный размер bbox в пикселях оригинального кадра.
    min_width: 30
    min_height: 30

calibration:
  points:
    - image: {x: 120,  y: 680}
      room:  {x: 0.0,  y: 0.0}
    - image: {x: 1160, y: 680}
      room:  {x: 5.0,  y: 0.0}
    - image: {x: 1160, y: 220}
      room:  {x: 5.0,  y: 4.0}
    - image: {x: 120,  y: 220}
      room:  {x: 0.0,  y: 4.0}
