server:
  addr: ":8080"

detector:
  # Максимальная ширина кадра перед детекцией — главный рычаг скорости.
  # Кадр масштабируется вниз, bbox-ы масштабируются обратно автоматически.
  # 640 → ~0.2–0.5с/кадр; 1280 → ~1–2с; без ресайза на 4K → минуты.
  max_width: 640

  # Шаг скользящего окна. 16 — хороший баланс скорость/качество.
  win_stride_x: 16
  win_stride_y: 16
  # Отступ у границ кадра
  padding_x: 4
  padding_y: 4
  # Масштабный шаг пирамиды. 1.1 быстрее 1.05 (вдвое меньше уровней).
  scale: 1.1
  # Порог SVM. 0 = любое положительное срабатывание.
  hit_threshold: 0.0
  # Минимальное число перекрывающихся окон (groupRectangles). Не трогать ниже 2.
  final_threshold: 2.0
  # Порог IoU для NMS. 0.65 — стандарт для пешеходов.
  nms_threshold: 0.65
  # Минимальный размер детектируемого человека в пикселях оригинального кадра
  min_width: 48
  min_height: 96

# Калибровка: соответствие точек кадра и координат помещения.
#
# Как снять калибровку:
#   1. Разместьте на полу помещения 4–8 хорошо видных маркеров (не на одной прямой!).
#   2. Измерьте их координаты в метрах от выбранного начала отсчёта (угол комнаты).
#   3. Сделайте снимок с камеры и определите пиксельные координаты тех же маркеров.
#   4. Заполните пары ниже. Порядок в парах должен совпадать.
#
# Важно: точки не должны лежать на одной прямой; должны покрывать всю зону наблюдения.
calibration:
  points:
    # Формат:
    #   image: пиксельная координата маркера на кадре
    #   room:  метрическая координата маркера в помещении
    - image: {x: 120,  y: 680}
      room:  {x: 0.0,  y: 0.0}
    - image: {x: 1160, y: 680}
      room:  {x: 5.0,  y: 0.0}
    - image: {x: 1160, y: 220}
      room:  {x: 5.0,  y: 4.0}
    - image: {x: 120,  y: 220}
      room:  {x: 0.0,  y: 4.0}
    # Дополнительные точки повышают точность:
    # - image: {x: 640, y: 450}
    #   room:  {x: 2.5, y: 2.0}
